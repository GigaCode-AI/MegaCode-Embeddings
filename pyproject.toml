[project]
name = "megacode-emb"
version = "0.1.1"
description = "MegaCode text2code embeddings model training and inference scripts"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "vllm==0.9.1",
    "transformers==4.53.1",
    "sentence-transformers==5.1.2",
    "scikit-learn==1.7.2",
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    "torch==2.7.0",
    "accelerate==0.27.2",
    "deepspeed==0.15.1",
    "safetensors",
    "tqdm",
]

[project.optional-dependencies]
inference = [
    "tensorboard",
]

[tool.setuptools.packages.find]
include = ["inference", "train"]
 
[build-system]
requires = ["setuptools>=80.9"]
build-backend = "setuptools.build_meta"
